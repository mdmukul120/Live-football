name: Football Data & Image Automation

on:
  schedule:
    # গিটহাব অ্যাকশনসে সর্বনিম্ন সীমা প্রতি ৫ মিনিট। 
    - cron: '*/5 * * * *'
  workflow_dispatch: # মেনুয়ালি রান করার অপশন

jobs:
  build-and-generate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Automation Script
      env:
        API_CATEGORIES: ${{ secrets.API_CATEGORIES }}
        API_SCHEDULED: ${{ secrets.API_SCHEDULED }}
        API_TRENDING_PLAYERS: ${{ secrets.API_TRENDING_PLAYERS }}
        API_LIVE_EVENTS: ${{ secrets.API_LIVE_EVENTS }}
        API_ODDS: ${{ secrets.API_ODDS }}
      run: python main.py

    - name: Commit and Push Generated Image & JSON
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add status_summary.png data_summary.json
        git commit -m "Auto update: Football live image & data [skip ci]" || exit 0
        git push
